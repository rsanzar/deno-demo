apps:
  deno-server:
    
    ci:
      jobs:
        - name: prepare-code
          runtime: deno-latest
          tshirt: standard
          commands:
            - deno -v
            - cp server.ts /app/server.ts
    cd:
      runtime: deno-latest
      tshirt: standard
      start_commands:
        # Deno requires the network flag to bind to port 3000
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535"
        - sysctl -w net.ipv4.tcp_tw_reuse=1
        - sysctl -w net.core.somaxconn=65535
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535

         
         # 💥 2. Chain ulimit and node in the same shell session
        - sh -c 'ulimit -n 65535 && exec deno run --allow-net /app/server.ts
      port: 3000
      connection_limit: 500
